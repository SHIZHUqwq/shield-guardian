name: shield_guardian
description: 个人数据泄露应急助手 - 帮助用户在数据泄露后快速响应和防护
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  permission_handler: ^11.0.1
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.1
  package_info_plus: ^5.0.1
  device_info_plus: ^9.1.1
  flutter_contacts: ^1.1.7
  share_plus: ^7.2.1
  installed_apps: ^1.4.0
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

# App图标配置
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#007AFF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
